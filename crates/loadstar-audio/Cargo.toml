[package]
name = "loadstar-audio"
description = "Low-latency spatial audio for game accessibility mods: spaces, buses, sources with geometry, effect chains as data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["miniaudio"]
# Device layer via a vendored miniaudio (WASAPI/DirectSound/WinMM on Windows, CoreAudio, ALSA,
# PulseAudio, JACK...). Only its low-level device API is used; Loadstar does all the mixing.
miniaudio = ["dep:cc"]

[dependencies]
loadstar-core.workspace = true
rtrb = "0.3"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
