[package]
name = "loadstar-ffi"
description = "C ABI for Loadstar (cdylib). Translation layer only — all logic lives in loadstar-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "loadstar"
crate-type = ["cdylib"]

[features]
default = ["audio", "speech", "speech-prism"]
audio = ["dep:loadstar-audio"]
# The speech surface (lv_*); positional speech needs both `speech` and `audio`.
speech = ["dep:loadstar-speech"]
speech-prism = ["speech", "loadstar-speech/prism"]

[dependencies]
loadstar-core.workspace = true
loadstar-audio = { workspace = true, optional = true }
loadstar-speech = { workspace = true, optional = true, default-features = false, features = ["sapi", "clipboard", "avspeech", "audio"] }
