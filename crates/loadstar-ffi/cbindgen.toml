language = "C"
header = "/* Loadstar C ABI. Generated by cbindgen from crates/loadstar-ffi — do not edit. */"
include_guard = "LOADSTAR_H"
include_version = true
cpp_compat = true
documentation = true
style = "both"
after_includes = "\n/* The audio surface (la_*) is compiled in by default. */\n#define LOADSTAR_AUDIO 1"

[export]
prefix = "Ls"
include = ["Vec3", "Status"]

[enum]
prefix_with_name = true

[parse]
parse_deps = true
include = ["loadstar-core"]

[defines]
"feature = audio" = "LOADSTAR_AUDIO"
