[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/bradjrenshaw/loadstar"

[workspace.dependencies]
loadstar-core = { path = "crates/loadstar-core", version = "0.1.0" }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"   # the FFI layer catches panics at the boundary; never abort a host game
